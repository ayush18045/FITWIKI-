<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Food Encyclopedia - FitWiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="navbar"></nav>

    <header>
        <h1>Food Encyclopedia</h1>
        <p>Macros per 100g for common foods. Filter by category.</p>
    </header>

    <main>
        <section>
            <div style="margin-bottom: 16px;">
                <button class="filter-btn active" onclick="filterFood('all',this)">All</button>
                <button class="filter-btn" onclick="filterFood('protein',this)">Protein Sources</button>
                <button class="filter-btn" onclick="filterFood('carbs',this)">Carbohydrates</button>
                <button class="filter-btn" onclick="filterFood('fats',this)">Healthy Fats</button>
                <button class="filter-btn" onclick="filterFood('dairy',this)">Dairy</button>
                <button class="filter-btn" onclick="filterFood('veg',this)">Vegetables</button>
            </div>
            <table>
                <thead>
                    <tr><th>Food</th><th>Category</th><th>Calories</th><th>Protein</th><th>Carbs</th><th>Fat</th><th>Benefit</th></tr>
                </thead>
                <tbody id="food-body"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <p>FitWiki &mdash; Free Fitness Knowledge</p>
    </footer>

    <script src="nav.js"></script>
    <script>
        renderNav('foods');

        const foods = [
            {name:'Chicken Breast',cat:'protein',cal:165,pro:31,carb:0,fat:3.6,benefit:'Best lean protein source'},
            {name:'Eggs (whole)',cat:'protein',cal:155,pro:13,carb:1.1,fat:11,benefit:'Complete protein with all amino acids'},
            {name:'Tuna (canned)',cat:'protein',cal:116,pro:26,carb:0,fat:1,benefit:'Very high protein, almost zero fat'},
            {name:'Paneer',cat:'protein',cal:265,pro:18,carb:3.6,fat:20,benefit:'Great vegetarian protein source'},
            {name:'Dal (cooked)',cat:'protein',cal:116,pro:9,carb:20,fat:0.4,benefit:'Protein and fibre, good for vegetarians'},
            {name:'Salmon',cat:'protein',cal:208,pro:20,carb:0,fat:13,benefit:'Omega-3 rich, good for recovery'},
            {name:'Rice (cooked)',cat:'carbs',cal:130,pro:2.7,carb:28,fat:0.3,benefit:'Good energy source for training'},
            {name:'Oats',cat:'carbs',cal:389,pro:17,carb:66,fat:7,benefit:'Slow digesting, keeps you full'},
            {name:'Sweet Potato',cat:'carbs',cal:86,pro:1.6,carb:20,fat:0.1,benefit:'Rich in vitamins, good pre-workout carb'},
            {name:'Banana',cat:'carbs',cal:89,pro:1.1,carb:23,fat:0.3,benefit:'Quick energy before workout'},
            {name:'Whole Wheat Roti',cat:'carbs',cal:297,pro:11,carb:58,fat:3,benefit:'Fibre-rich carb source'},
            {name:'Almonds',cat:'fats',cal:579,pro:21,carb:22,fat:50,benefit:'Healthy fats and vitamin E'},
            {name:'Peanut Butter',cat:'fats',cal:588,pro:25,carb:20,fat:50,benefit:'Calorie dense, good for bulking'},
            {name:'Avocado',cat:'fats',cal:160,pro:2,carb:9,fat:15,benefit:'Heart healthy monounsaturated fats'},
            {name:'Walnuts',cat:'fats',cal:654,pro:15,carb:14,fat:65,benefit:'Omega-3 fatty acids'},
            {name:'Milk (full fat)',cat:'dairy',cal:61,pro:3.2,carb:4.8,fat:3.3,benefit:'Good complete nutrition'},
            {name:'Greek Yogurt',cat:'dairy',cal:59,pro:10,carb:3.6,fat:0.4,benefit:'High protein with probiotics'},
            {name:'Cottage Cheese',cat:'dairy',cal:98,pro:11,carb:3.4,fat:4.3,benefit:'Slow digesting casein protein'},
            {name:'Broccoli',cat:'veg',cal:34,pro:2.8,carb:7,fat:0.4,benefit:'High fibre and vitamin C'},
            {name:'Spinach',cat:'veg',cal:23,pro:2.9,carb:3.6,fat:0.4,benefit:'Iron-rich, good for blood health'},
            {name:'Cucumber',cat:'veg',cal:15,pro:0.7,carb:3.6,fat:0.1,benefit:'Very low calorie, hydrating'},
        ];

        function renderFood(arr) {
            document.getElementById('food-body').innerHTML = arr.map(f => `
                <tr>
                    <td><strong>${f.name}</strong></td>
                    <td>${f.cat}</td>
                    <td>${f.cal} kcal</td>
                    <td style="color:#4caf50">${f.pro}g</td>
                    <td style="color:#4a9eff">${f.carb}g</td>
                    <td style="color:orange">${f.fat}g</td>
                    <td style="color:#aaa;font-size:13px">${f.benefit}</td>
                </tr>`).join('');
        }

        function filterFood(cat, btn) {
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderFood(cat === 'all' ? foods : foods.filter(f => f.cat === cat));
        }

        renderFood(foods);
    </script>
</body>
</html>
